{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Пароль изменён</title>
    <link rel="stylesheet" href="{% static 'css/password_reset.css' %}">
</head>

<body>

<main class="auth-page">

    <div class="auth-card auth-success">

        <div class="success-icon">
            ✓
        </div>

        <h1>Пароль успешно изменён</h1>

        <p class="auth-description">
            Ваш пароль был успешно изменён.
            Теперь вы можете войти в аккаунт
            используя новый пароль.
        </p>

        <a
            href="{% url 'login' %}"
            class="auth-button"
        >
            Войти
        </a>

    </div>

</main>
</body>
</html>

services:
  db:
    image: postgres:17
    container_name: psychology_lms_db

    env_file:
      - .env

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_user2 -d lms_db"]
      interval: 5s
      timeout: 5s
      retries: 5

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database_dump.sql:/docker-entrypoint-initdb.d/01_database_dump.sql:ro

  migrations:
    build: .
    command: python manage.py migrate

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy

  django:
    build: .
    command: gunicorn Psychology.wsgi:application --bind 0.0.0.0:8000 --workers 3
      
    env_file:
      - .env

    volumes:
    - ./media:/app/media
    - ./staticfiles:/app/staticfiles

    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./staticfiles:/app/staticfiles:ro
      - ./media:/app/media:ro
      
    depends_on:
      django:
        condition: service_started


volumes:
  postgres_data:

  
    <div class="modal-overlay" id="callbackModal">
        <div class="modal">
            <button class="modal-close" id="modalClose">
                <i class="fas fa-times"></i>
            </button>
            
            <h3 class="modal-title">Заказать обратный звонок</h3>
            
            <form id="callbackForm" action="{%url 'cal_aply' %}" method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label for="name">Ваше имя</label>
                    <input type="text" id="name" name="name" class="form-control"  placeholder="Иван" required>
                </div>
                
                <div class="form-group">
                    <label for="phone">Номер телефона</label>
                    <input type="tel" id="phone" name="phone" class="form-control"  value="{% if request.user.is_authenticated %}{{ request.user.fon_number }}{% endif %}" placeholder="+7 (___) ___-__-__" required>
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="agree" required>
                    <label for="agree">
                        Я соглашаюсь на обработку персональных данных в соответствии с 
                        <a href="/privacy/">Политикой конфиденциальности</a>
                    </label>

                </div>
                
                <button type="submit" class="btn btn-primary form-submit">
                    <i class="fas fa-paper-plane mr-2"> </i>Отправить заявку
                </button>
            </form>
        </div>
    </div>
